services:
  - type: web
    name: dashboard-faturamento
    env: python
    buildCommand: |
      apt-get update
      apt-get install -y unixodbc unixodbc-dev
      pip install -r requirements.txt
    startCommand: gunicorn backend.app.__main__:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7